name: Build APK

on:
  push:
    branches: [main]
    # The server inbox and docs don't affect the app; don't build a release for them alone.
    paths-ignore:
      - "server/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One secret, YOWZA_SIGNING, holds "<password>:<base64 of the .jks keystore>".
      # Key alias is "yowza"; store and key share the password.
      - name: Decode signing keystore
        env:
          YOWZA_SIGNING: ${{ secrets.YOWZA_SIGNING }}
        run: |
          if [ -n "$YOWZA_SIGNING" ]; then
            PW="${YOWZA_SIGNING%%:*}"
            echo "::add-mask::$PW"
            echo "${YOWZA_SIGNING#*:}" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/yowza.jks"
            {
              echo "YOWZA_KEYSTORE=$RUNNER_TEMP/yowza.jks"
              echo "YOWZA_KEYSTORE_PASSWORD=$PW"
              echo "YOWZA_KEY_PASSWORD=$PW"
              echo "YOWZA_KEY_ALIAS=yowza"
              echo "SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "Signing with the Yowza release key."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::YOWZA_SIGNING secret not set: building with the debug key and skipping the GitHub release."
          fi

      - name: Run unit tests and build release APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "yowza-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk yowza.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yowza-${{ env.VERSION }}
          path: yowza-${{ env.VERSION }}.apk

      - name: Publish GitHub release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Yowza! ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Built from ${{ github.sha }}.

            Install on your phone: download **yowza.apk** below and open it.
            Always-latest link: https://github.com/${{ github.repository }}/releases/latest/download/yowza.apk
          files: |
            yowza.apk
            yowza-${{ env.VERSION }}.apk
